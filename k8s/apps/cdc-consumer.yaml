apiVersion: v1
kind: Service
metadata:
  name: cdc-consumer
  namespace: cqrs-cdc
spec:
  type: NodePort
  selector:
    app: cdc-consumer
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdc-consumer
  namespace: cqrs-cdc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdc-consumer
  template:
    metadata:
      labels:
        app: cdc-consumer
    spec:
      containers:
        - name: cdc-consumer
          image: cqrs-cdc/cdc-consumer:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: cqrs-cdc-config
          env:
            - name: CONSUMER_PORT
              valueFrom:
                configMapKeyRef:
                  name: cqrs-cdc-config
                  key: CONSUMER_PORT
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
