apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: cqrs-cdc
spec:
  clusterIP: None
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
  selector:
    app: cassandra
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: cqrs-cdc
spec:
  serviceName: cassandra
  replicas: 3
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9042
              name: cql
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: "cdc-cluster"
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra.cqrs-cdc.svc.cluster.local"
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "100M"
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["sh", "-c", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
            initialDelaySeconds: 90
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-init
  namespace: cqrs-cdc
spec:
  template:
    metadata:
      name: cassandra-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cassandra-init
          image: cassandra:4.1
          command: ["sh", "-c", "until cqlsh cassandra-0.cassandra.cqrs-cdc.svc.cluster.local -e 'DESCRIBE KEYSPACES'; do echo 'waiting for cassandra...'; sleep 10; done; cqlsh cassandra-0.cassandra.cqrs-cdc.svc.cluster.local -f /init/01-init.cql"]
          volumeMounts:
            - name: cassandra-init-cql
              mountPath: /init
      volumes:
        - name: cassandra-init-cql
          configMap:
            name: cassandra-init-cql
