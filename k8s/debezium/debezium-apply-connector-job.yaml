apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-apply-mysql-connector
  namespace: cqrs-cdc
spec:
  backoffLimit: 6
  template:
    metadata:
      name: debezium-apply-mysql-connector
    spec:
      restartPolicy: OnFailure
      containers:
        - name: apply-connector
          image: curlimages/curl:8.7.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec"]
          args:
            - |
              echo "Waiting for Debezium Connect...";
              until curl -fsS http://debezium-connect:8083/connectors > /dev/null; do
                sleep 5;
              done

              echo "Deleting existing connector (if any)...";
              curl -fsS -X DELETE http://debezium-connect:8083/connectors/mysql-source-connector || true
              sleep 2

              echo "Applying connector config...";
              curl -fsS -X POST http://debezium-connect:8083/connectors \
                -H 'Content-Type: application/json' \
                --data-binary @/config/mysql-users-connector.json

              echo "Connector applied.";
          volumeMounts:
            - name: connector-config
              mountPath: /config
      volumes:
        - name: connector-config
          configMap:
            name: debezium-connector-config
